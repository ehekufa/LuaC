name: Nightly builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Tests and sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mbedTLS dependency
        run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev
      - name: Build and test
        run: make -j2 && SANITIZE=1 make test
      - name: TinyCC compatibility
        run: |
          mkdir -p /tmp/tinycc-src
          curl -fL https://codeload.github.com/tinycc/tinycc/tar.gz/f830a1697e159056b75de40a60464bc43ee670a3 -o /tmp/tinycc.tar.gz
          tar -xzf /tmp/tinycc.tar.gz -C /tmp/tinycc-src --strip-components=1
          patch -d /tmp/tinycc-src -p1 < tests/tinycc-noexecstack.patch
          (cd /tmp/tinycc-src && ./configure --prefix=/tmp/tinycc-install && make -j2 && make install)
          set +e
          TCC=/tmp/tinycc-install/bin/tcc ./tests/test_tinycc.sh > tinycc-test.log 2>&1
          status=$?
          set -e
          cat tinycc-test.log
          if [ "$status" -ne 0 ]; then
            message=$(tail -c 6000 tinycc-test.log | tr '\r\n' '  ' | sed 's/%/%25/g')
            printf '::error file=tests/test_tinycc.sh::%s\n' "$message"
            exit "$status"
          fi
      - name: CMake package and consumer test
        run: |
          set +e
          cmake -S . -B build-cmake -DBUILD_TESTING=ON -DLUAC_WITH_MBEDTLS=ON -DLUAC_WITH_MINIAUDIO=ON -DCMAKE_BUILD_TYPE=Release > cmake-build.log 2>&1 && cmake --build build-cmake -j2 >> cmake-build.log 2>&1 && ctest --test-dir build-cmake --output-on-failure >> cmake-build.log 2>&1
          status=$?
          set -e
          cat cmake-build.log
          if [ "$status" -ne 0 ]; then
            message=$(tail -c 6000 cmake-build.log | tr '\r\n' '  ')
            printf '::error file=CMakeLists.txt::%s\n' "$message"
            exit "$status"
          fi
          set +e
          {
            cmake --install build-cmake --prefix "$GITHUB_WORKSPACE/dist/cmake-prefix" &&
            cmake -S examples/embed -B build-embed -DCMAKE_PREFIX_PATH="$GITHUB_WORKSPACE/dist/cmake-prefix" &&
            cmake --build build-embed -j2 &&
            ./build-embed/luac-embed-compiler &&
            ./build-embed/luac-embed-native &&
            ./build-embed/luac-embed-engine
          } > cmake-consumer.log 2>&1
          status=$?
          set -e
          cat cmake-consumer.log
          if [ "$status" -ne 0 ]; then
            message=$(tail -c 6000 cmake-consumer.log | tr '\r\n' '  ' | sed 's/%/%25/g')
            printf '::error file=examples/embed/CMakeLists.txt::%s\n' "$message"
            exit "$status"
          fi

  linux:
    name: Linux CLI and libraries
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libmbedtls-dev
      - run: make -j2 MBEDTLS=1 MINIAUDIO=1 all libraries
      - name: HTTPS and audio smoke
        run: |
          set +e
          ./luac examples/https.lua > https-smoke.log 2>&1
          https_status=$?
          ./luac tests/audio.lua > audio-smoke.log 2>&1
          audio_status=$?
          ./tests/run_websocket.sh > websocket-smoke.log 2>&1
          websocket_status=$?
          set -e
          cat https-smoke.log audio-smoke.log websocket-smoke.log
          if [ "$https_status" -ne 0 ] || [ "$audio_status" -ne 0 ] || [ "$websocket_status" -ne 0 ]; then
            message=$(grep -E -C 2 'error:|error generated|undefined|RuntimeError|Assertion|failed' https-smoke.log audio-smoke.log websocket-smoke.log | tail -c 6000 | tr '\r\n' '  ' || true)
            printf '::error file=examples/https.lua::HTTPS %s, audio %s, WebSocket %s: %s\n' "$https_status" "$audio_status" "$websocket_status" "$message"
            exit 1
          fi
      - name: Package
        run: |
          mkdir -p dist/linux
          cp luac build/libluac.a build/libluac.so src/luac.h src/runtime.h src/luac_interpreter.h src/luac_love.h src/luac_compiled_project.h src/luac_pack.h src/luac_libraries.h src/luac_ffi.h src/luac_websocket.h src/luac_game.h src/luac_tls.h src/luac_audio.h src/engine.hpp README.md LICENSE dist/linux/
          cp -r src/third_party examples dist/linux/
          tar -C dist -czf dist/LuaC-linux-x86_64.tar.gz linux
          git archive --format=tar.gz --prefix=LuaC-0.5.0/ -o dist/LuaC-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: LuaC-linux-x86_64
          path: dist/LuaC-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: LuaC-source
          path: dist/LuaC-source.tar.gz

  windows:
    name: Windows EXE and libraries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
            p7zip
            diffutils
            mingw-w64-ucrt-x86_64-mbedtls
      - name: Build CLI
        shell: msys2 {0}
        env:
          CC: gcc
        run: |
          set +e
          make -j2 MBEDTLS=1 MINIAUDIO=1 all > build-cli.log 2>&1
          status=$?
          cat build-cli.log
          if [ "$status" -ne 0 ]; then
            message=$(tail -c 6000 build-cli.log | tr '\r\n' '  ')
            printf '::error file=Makefile::%s\n' "$message"
            exit "$status"
          fi
      - name: Build libraries
        shell: msys2 {0}
        env:
          CC: gcc
        run: make -j2 MBEDTLS=1 MINIAUDIO=1 libraries
      - name: Smoke test
        shell: msys2 {0}
        env:
          CC: gcc
          LUAC_TRACE: 1
        run: |
          ./luac.exe --version
          ./luac.exe examples/https.lua
          ./luac.exe tests/audio.lua
          ./luac.exe tests/runtime.lua
          set +e
          ./luac.exe examples/demo.lua > library-smoke.log 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            ./luac.exe tests/libraries.lua >> library-smoke.log 2>&1
            status=$?
          fi
          cat library-smoke.log
          if [ "$status" -ne 0 ]; then
            message=$(tail -c 1800 library-smoke.log | tr '\r\n' '  ')
            printf '::error file=tests/libraries.lua::%s\n' "$message"
            exit "$status"
          fi
      - name: Build bundled TinyCC
        shell: msys2 {0}
        run: |
          set -Eeuo pipefail
          log="$PWD/windows-tinycc-build.log"
          exec > >(tee "$log") 2>&1
          report_error() {
            status=$?
            trap - ERR
            message=$(tail -c 6000 "$log" | tr '\r\n' '  ' | sed 's/%/%25/g')
            printf '::error file=.github/workflows/build.yml::TinyCC build line %s: %s\n' "$1" "$message"
            exit "$status"
          }
          trap 'report_error "$LINENO"' ERR
          mkdir -p build/tinycc dist/windows/tcc
          curl -fL https://codeload.github.com/tinycc/tinycc/tar.gz/f830a1697e159056b75de40a60464bc43ee670a3 -o build/tinycc-source.tar.gz
          tar -xzf build/tinycc-source.tar.gz -C build/tinycc --strip-components=1
          cd build/tinycc
          ./configure --prefix="$(cd ../../dist/windows/tcc && pwd)" --cc=gcc
          make -j2
          make install
          cd ../..
          cp build/tinycc/COPYING dist/windows/tcc/COPYING
          cp build/tinycc-source.tar.gz dist/windows/tcc/tinycc-source.tar.gz
          cp src/third_party/tcc_compat/strings.h dist/windows/tcc/include/
          cp src/third_party/tcc_compat/crypt32.def dist/windows/tcc/lib/
          cp -r /ucrt64/include/mbedtls /ucrt64/include/psa dist/windows/tcc/include/
          # The diagnostic attribute requires GCC or Clang, not TinyCC.
          sed -i '/^#define MBEDTLS_DEPRECATED_WARNING$/c\#if !defined(__TINYC__)\n#define MBEDTLS_DEPRECATED_WARNING\n#endif' dist/windows/tcc/include/mbedtls/mbedtls_config.h
          # Match the winpthreads mutex layout without exposing GCC-only headers to TinyCC.
          cp src/third_party/tcc_compat/mbedtls_mutex.h dist/windows/tcc/include/luac_mbedtls_mutex.h
          sed -i '/^#include <pthread.h>$/c\#if defined(__TINYC__)\n#include <luac_mbedtls_mutex.h>\n#else\n#include <pthread.h>\n#endif' dist/windows/tcc/include/mbedtls/threading.h
          gcc tests/tcc_mbedtls_abi.c -o build/mbedtls-abi-gcc.exe
          dist/windows/tcc/tcc.exe tests/tcc_mbedtls_abi.c -o build/mbedtls-abi-tcc.exe
          build/mbedtls-abi-gcc.exe > build/mbedtls-abi-gcc.txt
          build/mbedtls-abi-tcc.exe > build/mbedtls-abi-tcc.txt
          diff -u build/mbedtls-abi-gcc.txt build/mbedtls-abi-tcc.txt
          for lib in mbedtls mbedx509 mbedcrypto; do
            set -- /ucrt64/bin/lib${lib}*.dll
            [ "$#" -eq 1 ] && [ -f "$1" ]
            dist/windows/tcc/tcc.exe -impdef "$1" -o "dist/windows/tcc/lib/lib${lib}.def"
          done
      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist/windows
          cp luac.exe build/libluac.a build/libluac.dll src/luac.h src/runtime.h src/luac_interpreter.h src/luac_love.h src/luac_compiled_project.h src/luac_pack.h src/luac_libraries.h src/luac_ffi.h src/luac_websocket.h src/luac_game.h src/luac_tls.h src/luac_audio.h src/engine.hpp README.md LICENSE dist/windows/
          cp -r src/third_party examples dist/windows/
          cp /ucrt64/bin/libmbed*.dll /ucrt64/bin/libwinpthread-1.dll /ucrt64/bin/libgcc_s_seh-1.dll dist/windows/
          mkdir -p dist/windows/licenses
          for component in mbedtls libwinpthread libgcc gcc-libs cc-libs; do
            if [ -d "/ucrt64/share/licenses/$component" ]; then cp -r "/ucrt64/share/licenses/$component" dist/windows/licenses/; fi
          done
          7z a -tzip dist/LuaC-windows-x86_64.zip ./dist/windows/*
      - name: Test relocated Windows package without GCC on PATH
        shell: msys2 {0}
        run: |
          set -Eeuo pipefail
          log="$PWD/windows-tinycc-test.log"
          exec > >(tee "$log") 2>&1
          report_error() {
            status=$?
            trap - ERR
            [ ! -f error.txt ] || cat error.txt
            echo 'DLL dependencies:'
            for dll in "${scratch:-/nonexistent}"/install/*.dll "$(cygpath -u "$TEMP")"/luac-*/main.c.dll; do
              [ -f "$dll" ] || continue
              echo "$(basename "$dll")"
              /ucrt64/bin/objdump -p "$dll" | grep 'DLL Name:' || true
            done
            message=$(tail -c 5000 "$log" | tr '\r\n' '  ' | sed 's/%/%25/g')
            printf '::error file=src/luac.c::Windows TinyCC test line %s: %s\n' "$1" "$message"
            exit "$status"
          }
          trap 'report_error "$LINENO"' ERR
          package="$(pwd)/dist/windows"
          scratch="$(mktemp -d)/LuaC package with spaces"
          mkdir -p "$scratch"
          cp -r "$package" "$scratch/install"
          cd "$scratch"
          unset CC
          export PATH=/usr/bin:/bin
          printf "a = 1234567\nprint(a)\n" > example.lua
          LUAC_TRACE=1 "$scratch/install/luac.exe" example.lua > output.txt 2> error.txt
          grep -F '1234567' output.txt
          grep -i 'tcc.exe' error.txt
          "$scratch/install/luac.exe" --aot example.lua -o "$scratch/install/example.exe"
          "$scratch/install/example.exe" | grep -F 1234567
          "$scratch/install/luac.exe" "$scratch/install/examples/https.lua"
          "$scratch/install/luac.exe" "$scratch/install/examples/audio.lua"
          "$scratch/install/luac.exe" "$scratch/install/examples/demo.lua"
          "$scratch/install/luac.exe" --emit-c example.lua -o generated.c
          "$scratch/install/tcc/tcc.exe" generated.c -o "$scratch/install/generated.exe" -lws2_32
          "$scratch/install/generated.exe" | grep -F 1234567
      - uses: actions/upload-artifact@v4
        with:
          name: LuaC-windows-x86_64
          path: dist/LuaC-windows-x86_64.zip

  macos:
    name: macOS CLI and libraries
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: brew install mbedtls@3 pkg-config
      - run: make -j2 MBEDTLS=1 MINIAUDIO=1 MBEDTLS_CFLAGS="-I$(brew --prefix mbedtls@3)/include" MBEDTLS_LDFLAGS="-L$(brew --prefix mbedtls@3)/lib -lmbedtls -lmbedx509 -lmbedcrypto" all
      - run: make -j2 MBEDTLS=1 MINIAUDIO=1 MBEDTLS_CFLAGS="-I$(brew --prefix mbedtls@3)/include" MBEDTLS_LDFLAGS="-L$(brew --prefix mbedtls@3)/lib -lmbedtls -lmbedx509 -lmbedcrypto" libraries
      - name: HTTPS and audio smoke
        env:
          LUAC_CFLAGS: -Wno-deprecated-declarations
        run: |
          set +e
          ./luac examples/https.lua > https-smoke.log 2>&1
          https_status=$?
          ./luac tests/audio.lua > audio-smoke.log 2>&1
          audio_status=$?
          ./tests/run_websocket.sh > websocket-smoke.log 2>&1
          websocket_status=$?
          ./luac tests/runtime.lua > runtime-smoke.log 2>&1
          runtime_status=$?
          set -e
          cat https-smoke.log audio-smoke.log websocket-smoke.log runtime-smoke.log
          if [ "$https_status" -ne 0 ] || [ "$audio_status" -ne 0 ] || [ "$websocket_status" -ne 0 ] || [ "$runtime_status" -ne 0 ]; then
            https_message=$(grep -E -C 2 'error:|error generated|undefined|RuntimeError|Assertion|failed' https-smoke.log | tail -c 4000 | tr '\r\n' '  ' || true)
            audio_message=$(grep -E -C 2 'error:|error generated|undefined|RuntimeError|Assertion|failed' audio-smoke.log websocket-smoke.log runtime-smoke.log | tail -c 4000 | tr '\r\n' '  ' || true)
            printf '::error file=examples/https.lua::HTTPS status %s: %s; audio status %s: %s\n' "$https_status" "$https_message" "$audio_status" "$audio_message"
            exit 1
          fi
      - name: Package universal sources and native arm64 build
        run: |
          mkdir -p dist/macos
          cp luac build/libluac.a build/libluac.dylib src/luac.h src/runtime.h src/luac_interpreter.h src/luac_love.h src/luac_compiled_project.h src/luac_pack.h src/luac_libraries.h src/luac_ffi.h src/luac_websocket.h src/luac_game.h src/luac_tls.h src/luac_audio.h src/engine.hpp README.md LICENSE dist/macos/
          cp -r src/third_party examples dist/macos/
          tar -C dist -czf dist/LuaC-macos-arm64.tar.gz macos
      - uses: actions/upload-artifact@v4
        with:
          name: LuaC-macos-arm64
          path: dist/LuaC-macos-arm64.tar.gz

  gui-linux:
    name: Vulkan Studio Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vulkan and GLFW dependencies
        run: sudo apt-get update && sudo apt-get install -y libglfw3-dev libvulkan-dev glslang-tools pkg-config xvfb xauth xdotool xclip mesa-vulkan-drivers
      - run: make -j2 all gui
      - name: Vulkan Studio clipboard smoke
        run: xvfb-run -a ./tests/studio_smoke.sh
      - name: Package
        run: |
          mkdir -p dist/studio-linux/build
          cp luac build/luac-gui src/runtime.h src/luac_interpreter.h src/luac_love.h src/luac_compiled_project.h src/luac_pack.h src/luac_libraries.h src/luac_ffi.h src/luac_websocket.h src/luac_game.h src/luac_tls.h src/luac_audio.h README.md LICENSE dist/studio-linux/
          cp gui/third_party/Nuklear-LICENSE gui/FONT-LICENSE.txt dist/studio-linux/
          cp build/*.spv dist/studio-linux/build/
          cp -r src/third_party examples dist/studio-linux/
          tar -C dist -czf dist/LuaC-Studio-linux-x86_64.tar.gz studio-linux
      - uses: actions/upload-artifact@v4
        with:
          name: LuaC-Studio-linux-x86_64
          path: dist/LuaC-Studio-linux-x86_64.tar.gz

  gui-windows:
    name: Vulkan Studio Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            make
            p7zip
            pkgconf
            mingw-w64-ucrt-x86_64-glfw
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-glslang
      - name: Build Vulkan Studio
        shell: msys2 {0}
        env:
          CC: gcc
          CXX: g++
        run: make -j2 all gui
      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p dist/studio-windows/build
          cp luac.exe build/luac-gui.exe src/runtime.h src/luac_interpreter.h src/luac_love.h src/luac_compiled_project.h src/luac_pack.h src/luac_libraries.h src/luac_ffi.h src/luac_websocket.h src/luac_game.h src/luac_tls.h src/luac_audio.h README.md LICENSE dist/studio-windows/
          cp gui/third_party/Nuklear-LICENSE gui/FONT-LICENSE.txt dist/studio-windows/
          cp /ucrt64/bin/glfw3.dll dist/studio-windows/
          if [ -f /ucrt64/bin/vulkan-1.dll ]; then cp /ucrt64/bin/vulkan-1.dll dist/studio-windows/; fi
          cp build/*.spv dist/studio-windows/build/
          cp -r src/third_party examples dist/studio-windows/
          7z a -tzip dist/LuaC-Studio-windows-x86_64.zip ./dist/studio-windows/*
      - uses: actions/upload-artifact@v4
        with:
          name: LuaC-Studio-windows-x86_64
          path: dist/LuaC-Studio-windows-x86_64.zip

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android command-line tools
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools" /tmp/android-cli
          curl -fL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-cli/tools.zip
          unzip -q /tmp/android-cli/tools.zip -d /tmp/android-cli
          rm -rf "$ANDROID_HOME/cmdline-tools/latest"
          mv /tmp/android-cli/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
      - name: Install Android NDK and CMake
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" 'ndk;27.2.12479018' 'cmake;3.22.1' 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check Android text contrast
        run: python3 android/tests/test_theme.py
      - name: Assemble APK
        working-directory: android
        shell: bash
        run: |
          if ! gradle --no-daemon testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest > android-build.log 2>&1; then
            message=$(grep -E '(^|[ :])error:|undefined reference|undefined symbol|FAILURE:|^e:' android-build.log | tail -c 3000 | tr '\r\n' '  ' || true)
            echo "::error file=android/app/build.gradle::${message}"
            tail -100 android-build.log
            exit 1
          fi
          tail -20 android-build.log
      - name: Package APK
        run: mkdir -p dist && cp android/app/build/outputs/apk/debug/app-debug.apk dist/LuaC-Studio-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LuaC-Studio-Android-APK
          path: dist/LuaC-Studio-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LuaC-Android-device-test-apks
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          retention-days: 2
          if-no-files-found: error


  android-device:
    name: Android device API ${{ matrix.api }}
    runs-on: ubuntu-latest
    needs: android
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 26
            target: google_apis
          - api: 30
            target: default
          - api: 35
            target: google_apis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: LuaC-Android-device-test-apks
          path: android/app/build/outputs/apk
      - name: Ensure Android build tools
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'
      - name: Enable hardware virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Build, install and run project APKs
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: ${{ matrix.target }}
          disable-animations: true
          script: cd android && LUAC_DEVICE_PREBUILT=1 bash tests/run_apk_device.sh

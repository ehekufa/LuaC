name: Inspect final Windows jobs
on: push
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          : > /tmp/windows.log
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/129354270335/logs >> /tmp/windows.log 2>&1 || true
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/129354270551/logs >> /tmp/windows.log 2>&1 || true
          python3 - <<'PY'
          import json
          from pathlib import Path
          text = Path('/tmp/windows.log').read_text(errors='replace')[-55000:]
          Path('/tmp/comment.json').write_text(json.dumps({'body': '### Windows diagnostics\n\n```text\n' + text + '\n```'}))
          PY
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments --input /tmp/comment.json

name: Inspect traced Windows JIT
on: push
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Export command trace
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/129360048142/logs > /tmp/windows.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          text = Path('/tmp/windows.log').read_text(errors='replace')[-55000:]
          Path('/tmp/comment.json').write_text(json.dumps({'body': '```text\n' + text + '\n```'}))
          PY
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments --input /tmp/comment.json

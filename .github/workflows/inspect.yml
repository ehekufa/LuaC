name: Inspect Windows JIT
on: push
permissions:
  actions: read
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --allow-escape-sequences repos/${{ github.repository }}/actions/jobs/129358338266/logs > /tmp/windows-jit.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          text = Path('/tmp/windows-jit.log').read_text(errors='replace')[-55000:]
          Path('/tmp/comment.json').write_text(json.dumps({'body': '### Windows JIT diagnostics\n\n```text\n' + text + '\n```'}))
          PY
          gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments --input /tmp/comment.json

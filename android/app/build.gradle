plugins { id 'com.android.application' }

android {
    namespace 'com.luac.studio'
    compileSdk 35
    sourceSets.main.java.srcDir "../shared/src/main/java"
    sourceSets.main.assets.srcDir "$buildDir/generated/runnerAssets"
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.luac.studio'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '0.4.2'
        externalNativeBuild {
            cmake { cppFlags '-std=c++17' }
        }
    }
    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' }
    }
    buildTypes {
        debug { minifyEnabled false }
        release { minifyEnabled false }
    }
}

dependencies {
    implementation 'com.android.tools.build:apksig:8.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.bouncycastle:bcpkix-jdk18on:1.78.1'
    testImplementation 'org.json:json:20240303'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'
}

// The runner is built from source and packaged as an unsigned template, not as a
// checked-in binary. Building a project fills and signs this template on-device.
def prepareRunnerTemplate = tasks.register('prepareRunnerTemplate', Copy) {
    dependsOn ':runner:assembleRelease'
    from("$rootDir/runner/build/outputs/apk/release/runner-release-unsigned.apk")
    into("$buildDir/generated/runnerAssets")
    rename { 'runner-template.apk' }
}
tasks.named('preBuild').configure { dependsOn prepareRunnerTemplate }
tasks.withType(Test).configureEach {
    dependsOn prepareRunnerTemplate
    systemProperty 'runner.template', "$buildDir/generated/runnerAssets/runner-template.apk"
}
